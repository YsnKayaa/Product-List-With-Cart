<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tatlılar | Sepetli Ürün Listesi</title>
  <meta name="description" content="Sepetli ürün listesi: tatlıları sepete ekleyin, adetleri yönetin ve siparişinizi onaylayın." />

  <!-- Temayı sayfa çizilmeden önce uygula (beyaz yanıp sönmeyi önler) -->
  <script>
    (function () {
      var theme = null;
      try { theme = JSON.parse(localStorage.getItem("plwc-theme")); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <main class="layout">
      <section class="products" aria-labelledby="page-title">
        <header class="products__header">
          <h1 id="page-title" class="products__title" tabindex="-1" data-i18n="title">Tatlılar</h1>

          <div class="toolbar">
            <button type="button" class="icon-btn" id="lang-toggle">
              <svg class="icon-btn__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z" />
              </svg>
              <span class="icon-btn__label" id="lang-label">TR</span>
            </button>

            <button type="button" class="icon-btn icon-btn--round" id="theme-toggle">
              <!-- Ay: açık temadayken gösterilir -->
              <svg class="icon-btn__icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" />
              </svg>
              <!-- Güneş: koyu temadayken gösterilir -->
              <svg class="icon-btn__icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.2" />
                <path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" />
              </svg>
            </button>
          </div>
        </header>

        <ul class="product-grid" id="product-grid" role="list"></ul>
      </section>

      <aside class="cart" aria-labelledby="cart-title">
        <h2 class="cart__title" id="cart-title" tabindex="-1"></h2>
        <div id="cart-body"></div>
      </aside>
    </main>
  </div>

  <!-- Ekran okuyucu duyuruları -->
  <div class="sr-only" id="live-region" aria-live="polite" aria-atomic="true"></div>

  <!-- "Siparişi onaylamak istiyor musunuz?" penceresi -->
  <dialog class="modal modal--confirm" id="confirm-modal" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
    <div class="modal__content">
      <svg class="modal__icon modal__icon--question" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="3" />
        <path d="M18.5 18.5a5.5 5.5 0 1 1 7.6 5.1c-1.3.5-2.1 1.7-2.1 3.1V28" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        <circle cx="24" cy="34" r="2" fill="currentColor" />
      </svg>
      <h2 class="modal__title modal__title--sm" id="confirm-title" data-i18n="confirmQuestion">Siparişi onaylamak istiyor musunuz?</h2>
      <p class="modal__desc" id="confirm-desc"></p>
      <div class="modal__actions">
        <button type="button" class="btn-secondary" id="confirm-cancel-btn" data-i18n="cancel">Vazgeç</button>
        <button type="button" class="btn-primary" id="confirm-yes-btn" data-i18n="confirmYes">Evet, Onayla</button>
      </div>
    </div>
  </dialog>

  <!-- Sipariş onay modalı -->
  <dialog class="modal" id="order-modal" aria-labelledby="modal-title" aria-describedby="modal-desc">
    <div class="modal__content">
      <svg class="modal__icon" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="3" />
        <path d="M15 24.5l6 6 12-13" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h2 class="modal__title" id="modal-title" data-i18n="modalTitle">Sipariş Onaylandı</h2>
      <p class="modal__desc" id="modal-desc" data-i18n="modalDesc">Afiyet olsun, siparişinizin keyfini çıkarın!</p>

      <div class="modal__summary">
        <ul class="modal__list" id="modal-list" role="list"></ul>
        <div class="order-total order-total--modal">
          <span data-i18n="orderTotal">Sipariş Toplamı</span>
          <strong class="order-total__value" id="modal-total"></strong>
        </div>
      </div>

      <button type="button" class="btn-primary" id="new-order-btn" data-i18n="startNewOrder">Yeni Sipariş Başlat</button>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
